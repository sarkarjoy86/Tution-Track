name: tution_track
description: TutionTrack - Private tutor attendance tracking app
publish_to: 'none'
version: 1.5.2+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.6.0
  cloud_firestore: ^5.6.6

  # Google Sign-In
  google_sign_in: ^6.2.1

  # Responsive Design
  flutter_screenutil: ^5.9.3

  # Calendar
  table_calendar: ^3.1.2

  # Progress Indicators
  percent_indicator: ^4.2.3

  # Typography
  google_fonts: ^6.2.1

  # Date Formatting
  intl: ^0.19.0

  # Material Icons (built-in)
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.0
  connectivity_plus: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

